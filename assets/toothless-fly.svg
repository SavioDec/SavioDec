<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170">
<style>
@keyframes cyc{from{transform:translateX(0)}to{transform:translateX(-1323px)}}
@keyframes go{from{transform:translateX(800px)}to{transform:translateX(-189px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
.fly{animation:go 9s linear infinite}
.bob{animation:bob 1.6s ease-in-out infinite}
.s{animation:cyc 0.7s steps(7) infinite;image-rendering:pixelated}
</style>
<g class="fly"><g class="bob"><svg x="0" y="4" width="189" height="140" viewBox="0 0 189 140" overflow="hidden"><image class="s" href="data:image/png;base64," width="1323" height="140" style=""/></svg></g></g>
</svg>