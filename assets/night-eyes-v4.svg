<svg xmlns="http://www.w3.org/2000/svg" width="110" height="44" viewBox="0 0 110 44">
<style>
@keyframes show{0%,60%{opacity:0}66%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes blink{0%,70%,76%,100%{transform:scaleY(1)}73%{transform:scaleY(.08)}}
.e{animation:show 18s ease-in-out infinite}
.l{transform-origin:38px 22px;animation:blink 18s linear infinite}
.r{transform-origin:72px 22px;animation:blink 18s linear infinite}
</style>
<defs><radialGradient id="g"><stop offset="0" stop-color="#b8ff6a"/><stop offset="1" stop-color="#2ecc40"/></radialGradient></defs>
<rect width="110" height="44" rx="22" fill="#0d1117"/>
<g class="e">
<g class="l"><ellipse cx="38" cy="22" rx="11" ry="8" fill="url(#g)"/><ellipse cx="38" cy="22" rx="2.2" ry="7" fill="#0d1117"/></g>
<g class="r"><ellipse cx="72" cy="22" rx="11" ry="8" fill="url(#g)"/><ellipse cx="72" cy="22" rx="2.2" ry="7" fill="#0d1117"/></g>
</g>
</svg>
